name: Notify IndexNow after Pages
on:
  workflow_run:
    workflows: ["pages-build-deployment", "pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: indexnow-pages-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify only verified public pages
        env:
          PAGES_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,time,urllib.request,urllib.error
          BASE='https://mickacdx-cloud.github.io/mindversechronicles/'
          REPO='mickacdx-cloud/mindversechronicles'
          KEY='c8900bb3b1c80172405ac45368995bb0'
          SHA=os.environ['PAGES_COMMIT']
          assert re.fullmatch(r'[a-f0-9]{40}',SHA), 'Invalid commit identity'
          HEADERS={'User-Agent':'MindVerseChronicles-IndexNow/1.0'}
          def get(url):
              req=urllib.request.Request(url,headers=HEADERS)
              with urllib.request.urlopen(req,timeout=25) as response:
                  assert response.status==200
                  return response.read()
          def valid_path(path):
              return bool(re.fullmatch(r'[a-z0-9][a-z0-9-]*\.html',path)) and path not in ('404.html',) and not path.startswith('google')
          raw='https://raw.githubusercontent.com/'+REPO+'/'+SHA+'/'
          try:
              manifest=json.loads(get(raw+'indexnow-manifest.txt'))
          except urllib.error.HTTPError as error:
              if error.code==404:
                  print('No indexing manifest in this deployment yet; no submission.')
                  raise SystemExit(0)
              raise
          assert manifest['base_url']==BASE
          pages={item['path']:item['sha256'] for item in manifest['pages']}
          assert all(valid_path(p) and re.fullmatch('[a-f0-9]{64}',h) for p,h in pages.items())
          if os.environ.get('FORCE_ALL')=='true':
              chosen=list(pages)
          else:
              commit=json.loads(get('https://api.github.com/repos/'+REPO+'/commits/'+SHA))
              changed=[f['filename'] for f in commit['files'] if f['status']!='removed']
              chosen=list(pages) if any(p in changed for p in ['style.css','site.js','indexnow-manifest.txt']) else [p for p in changed if p in pages]
          if not chosen:
              print('No public page content change; no submission.')
              raise SystemExit(0)
          assert len(chosen)<=100
          key_location=BASE+KEY+'.txt'
          verified=False
          for attempt in range(4):
              try:
                  assert get(key_location).decode().strip()==KEY, 'Ownership key mismatch'
                  for path in chosen:
                      assert hashlib.sha256(get(BASE+path)).hexdigest()==pages[path], 'Public content not yet matching deployment: '+path
                  verified=True
                  break
              except (AssertionError,urllib.error.URLError,TimeoutError):
                  if attempt==3:raise
                  time.sleep(3*(attempt+1))
          assert verified
          payload={'host':'mickacdx-cloud.github.io','key':KEY,'keyLocation':key_location,'urlList':[BASE+p for p in chosen]}
          request=urllib.request.Request('https://api.indexnow.org/indexnow',data=json.dumps(payload).encode(),headers={**HEADERS,'Content-Type':'application/json; charset=utf-8'},method='POST')
          # Exactly one POST: an ambiguous timeout must never cause an automatic duplicate.
          with urllib.request.urlopen(request,timeout=35) as response:
              status=response.status
          assert status in (200,202), status
          message='IndexNow received '+str(len(chosen))+' public URLs. HTTP '+str(status)+'. This does not confirm indexing or ranking.'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as summary:
              summary.write(message+'\n\n'+'\n'.join('- '+BASE+p for p in chosen)+'\n')
          PY
